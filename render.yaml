services:
  - type: web
    name: hybrid-athlete-garmin-sync
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r services/garmin_sync/requirements.txt
    startCommand: uvicorn services.garmin_sync.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: PYTHONIOENCODING
        value: utf-8
      - key: PYTHONUTF8
        value: "1"
      - key: GARMIN_TOKEN_DIR
        value: /tmp/garmin_tokens
      - key: GARMIN_SERVICE_SECRET
        generateValue: true
